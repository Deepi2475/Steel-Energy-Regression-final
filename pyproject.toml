[project]
name = "steel-energy-ml"
version = "0.1.0"
description = "Energy consumption regression with time-based drift, MLflow, FastAPI"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "h2o>=3.44.0.3",
  "mlflow>=2.16",
  "boto3>=1.34",
  "psycopg2-binary>=2.9",
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "xgboost>=2.1",
  "lightgbm>=4.5",
  "matplotlib>=3.9",
  "seaborn>=0.13",
  "evidently>=0.4.29",
  "nannyml>=0.7.0",
  "joblib>=1.3",
  "kaleido==0.2.1"
]

[dependency-groups]
dev = [
  "black>=24.10",
  "ruff>=0.6",
]